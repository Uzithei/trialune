[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "evaluation-orchestrator"
version = "0.2.0"
description = "Local agent evaluation: task execution, controlled tools and reproducible evidence"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.13"
dependencies = []
keywords = ["agents", "evaluation", "testing", "regression", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
eval-orchestrator = "eval_orchestrator.interfaces.cli:main"
agent-eval = "eval_orchestrator.interfaces.agent_cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/eval_orchestrator"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts", "/docs", "/examples", "/fixtures", "/.github",
    "/README.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/CODE_OF_CONDUCT.md",
    "/SECURITY.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/.python-version",
    "/.gitignore", "/.gitattributes", "/.editorconfig",
]

[tool.hatch.build]
exclude = ["/.cache", "/artifacts", "/.venv", "/dist", "/.local", "/AGENTS.md", "**/__pycache__"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache", "artifacts", ".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"

[tool.coverage.run]
source = ["eval_orchestrator"]
branch = true

[tool.coverage.report]
show_missing = true
